[pytest]
testpaths = tests
addopts = -v -ra --tb=short --color=yes --durations=10 -m "not llm"
markers =
    unit: offline, deterministic — no Ollama required (the default tier)
    llm: requires a live Ollama instance; deselected unless run with -m llm
filterwarnings =
    ignore::DeprecationWarning
