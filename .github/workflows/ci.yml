name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # The OCR dependency group is deliberately absent: Paddle is large and
      # the OCR adapter is covered with deterministic fakes in the standard gate.
      - run: uv sync --frozen

      - name: Audit locked Python dependencies
        run: |
          uv export --frozen --all-groups --output-file /tmp/asepsis-audit.txt
          uv run pip-audit --disable-pip --requirement /tmp/asepsis-audit.txt

      # F rules only — undefined names, broken imports, unused imports. The class
      # of bug that has actually shipped here twice, both times with the whole
      # suite green. Style rules are not selected on purpose.
      - name: Lint
        run: uv run ruff check . --select F,E9

      - name: Install operator-console browser
        run: uv run playwright install --with-deps chromium

      # No Ollama on the runner. Tests needing a live model skip themselves; they
      # do not report a missing model as a retrieval-quality failure.
      #
      # Gated at 80%: what .coveragerc measures is the code we write and CI can
      # run, so the bar is real rather than an average softened by vendored and
      # OCR-only modules. xfail(strict) tests count as passing while the gaps
      # they document are open, and turn into failures the day they are closed.
      - name: Test
        run: uv run pytest -q --cov --cov-report=term --cov-fail-under=80
