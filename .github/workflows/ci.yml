name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # requirements-ocr.txt (paddle, ~1GB) is deliberately absent: the OCR path
      # imports it lazily, so everything here runs without it.
      - run: pip install -r requirements-dev.txt

      # F rules only — undefined names, broken imports, unused imports. The class
      # of bug that has actually shipped here twice, both times with the whole
      # suite green. Style rules are not selected on purpose.
      - name: Lint
        run: ruff check . --select F,E9

      # No Ollama on the runner. Tests needing a live model skip themselves; they
      # do not report a missing model as a retrieval-quality failure.
      #
      # Gated at 80%: what .coveragerc measures is the code we write and CI can
      # run, so the bar is real rather than an average softened by vendored and
      # OCR-only modules. xfail(strict) tests count as passing while the gaps
      # they document are open, and turn into failures the day they are closed.
      - name: Test
        run: pytest -q --cov --cov-report=term --cov-fail-under=80
